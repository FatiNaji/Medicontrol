<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MediControl</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef8ff;
            color: #17243b;
            min-height: 100vh;
            display: flex;
        }

        .lado {
            width: 220px;
            background: white;
            border-right: 1px solid #e2ebf3;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 145px;
            max-width: 100%;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu a {
            text-decoration: none;
            color: #17243b;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 14px;
        }

        .menu a:hover {
            background: #dcefff;
            color: #0878d1;
        }

        .menu i {
            width: 20px;
            text-align: center;
        }

        .principal {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .logo-login {
            text-align: center;
            margin-bottom: 18px;
        }

        .logo-login img {
            width: 125px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .subtitulo {
            text-align: center;
            color: #65758b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d7e3ed;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0878d1;
        }

        .btn-ingresar {
            width: 100%;
            border: none;
            background: #0878d1;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-ingresar:hover {
            background: #0668b5;
        }

        .opciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 20px;
            font-size: 12px;
        }

        .opciones a {
            color: #0878d1;
            text-decoration: none;
        }

        .opciones label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .opciones input {
            width: auto;
            margin: 0;
        }

        .separador {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0;
            color: #a0aec0;
            font-size: 12px;
        }

        .separador::before,
        .separador::after {
            content: "";
            height: 1px;
            background: #dce6ef;
            flex: 1;
        }

        .tipos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tipo {
            border: none;
            background: #eaf6ff;
            color: #0878d1;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .tipo:hover {
            background: #dcefff;
        }

        .registro {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #65758b;
        }

        .registro a {
            color: #0878d1;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            body {
                display: block;
            }

            .lado {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2ebf3;
            }

            .menu {
                display: none;
            }

            .principal {
                min-height: calc(100vh - 130px);
                padding: 20px;
            }
        }
    </style>

<style id="medicontrol-pro">
/* ===== MediControl Pro UI Upgrade ===== */
:root{
    --mc-primary:#0878d1;
    --mc-primary-soft:#dcefff;
    --mc-bg:#eef8ff;
    --mc-text:#17243b;
    --mc-muted:#65758b;
    --mc-card:#ffffff;
    --mc-border:#e2ebf3;
    --mc-shadow:0 10px 30px rgba(25,65,100,.08);
    --mc-shadow-hover:0 16px 38px rgba(25,65,100,.15);
}

html{scroll-behavior:smooth;}

body{
    animation:mcPageIn .55s ease both;
}

@keyframes mcPageIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* Entradas suaves */
header,.hero,.content,.contenido,.principal,.login,.services,.cards,.quick-access,
.calendar,.record,.history-box,.tarjeta,.seccion,.cita,.familia,.medication-card,
.medicine-card,.lista-citas,.registro,.perfil,.contenedor,.recordatorios{
    animation:mcSectionIn .65s cubic-bezier(.2,.75,.25,1) both;
}

@keyframes mcSectionIn{
    from{opacity:0; transform:translateY(16px);}
    to{opacity:1; transform:translateY(0);}
}

/* Botones y enlaces */
button,
.btn-login,.btn-register,.btn-comenzar,.btn-ingresar,.btn-agregar,
.btn-view,.btn-ver,.boton,.btn-nueva,.btn-alarma{
    transition:transform .22s ease, box-shadow .22s ease, background-color .22s ease,
               color .22s ease, border-color .22s ease, filter .22s ease;
}

button:hover,
.btn-login:hover,.btn-register:hover,.btn-comenzar:hover,.btn-ingresar:hover,
.btn-agregar:hover,.btn-view:hover,.btn-ver:hover,.boton:hover,
.btn-nueva:hover,.btn-alarma:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(8,120,209,.20);
    filter:brightness(1.03);
}

button:active,
.btn-login:active,.btn-register:active,.btn-comenzar:active,.btn-ingresar:active,
.btn-agregar:active,.btn-view:active,.btn-ver:active,.boton:active,
.btn-nueva:active,.btn-alarma:active{
    transform:translateY(0) scale(.98);
}

/* Tarjetas: profundidad */
.card,.quick-card,.tarjeta,.seccion,.cita,.familia,.record,.history-box,
.medicine-card,.medication-card,.registro,.tipo,.opcion,.perfil,.recordatorios,
.calendar,.cita-principal,.barra-citas,.lista-citas,.lista,.detalle{
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.card:hover,.quick-card:hover,.tarjeta:hover,.seccion:hover,.cita:hover,
.familia:hover,.record:hover,.history-box:hover,.medicine-card:hover,
.medication-card:hover,.registro:hover,.tipo:hover,.opcion:hover,
.perfil:hover,.recordatorios:hover,.cita-principal:hover{
    transform:translateY(-4px);
    box-shadow:var(--mc-shadow-hover);
}

/* Menú más vivo */
.menu a,nav a,.logout a{
    transition:color .2s ease, background-color .2s ease, transform .2s ease;
}
.menu a:hover,.logout a:hover{transform:translateX(3px);}

/* Iconos con microinteracción */
.card-icon,.icono-medicina,.icono,.avatar{
    transition:transform .25s ease;
}
.card:hover .card-icon,.quick-card:hover .card-icon,
.tarjeta:hover .icono-medicina,.familia:hover .avatar{
    transform:scale(1.06) rotate(-2deg);
}

/* Inputs */
input,select,textarea{
    transition:border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
}
input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--mc-primary);
    box-shadow:0 0 0 3px rgba(8,120,209,.12);
}

/* Respeto por accesibilidad */
@media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}

/* ===== Responsive real para celular ===== */
@media (max-width: 900px){
    header{
        padding:0 24px;
    }
    nav{gap:16px;}
    .hero{gap:25px;}
    .content,.contenido{
        padding:25px 22px;
    }
}

@media (max-width: 768px){
    body{overflow-x:hidden;}

    /* Sidebars pasan arriba y dejan de ocupar toda la pantalla */
    .sidebar{
        position:relative !important;
        top:auto !important;
        left:auto !important;
        bottom:auto !important;
        width:100% !important;
        min-height:auto !important;
        height:auto !important;
        padding:12px 14px !important;
        border-right:none !important;
        border-bottom:1px solid var(--mc-border);
        z-index:10;
    }

    .app{display:block !important;}

    .sidebar .logo{
        text-align:center;
        margin-bottom:10px !important;
        padding:4px 5px 10px !important;
    }

    .sidebar .logo img{
        max-width:150px;
        max-height:48px;
        object-fit:contain;
    }

    .menu{
        flex-direction:row !important;
        flex-wrap:wrap !important;
        gap:6px !important;
        justify-content:center;
    }

    .menu a{
        flex:0 1 auto;
        padding:9px 10px !important;
        font-size:12px !important;
    }

    .menu a i{width:auto !important;}

    .logout{
        position:static !important;
        margin-top:7px !important;
        left:auto !important;
        right:auto !important;
        bottom:auto !important;
    }

    .logout a,.cerrar{
        justify-content:center;
        padding:8px 10px !important;
    }

    .content,.contenido{
        margin-left:0 !important;
        width:100% !important;
        padding:22px 16px !important;
    }

    .encabezado,.page-header,.hero{
        flex-direction:column !important;
        align-items:flex-start !important;
    }

    .header-buttons{
        width:100%;
        justify-content:flex-end;
    }

    /* Landing */
    header{
        height:auto;
        min-height:70px;
        flex-wrap:wrap;
        gap:10px;
        padding:12px 18px;
    }

    .logo{max-width:145px;}
    nav{
        order:3;
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
        gap:12px 18px;
        padding-bottom:4px;
    }

    .hero-text h1{font-size:clamp(30px,8vw,46px) !important;}
    .hero-image{width:100% !important;}
    .services{grid-template-columns:1fr !important;}
    .cards{grid-template-columns:1fr !important;}
    .quick-access{grid-template-columns:1fr !important;}

    /* Tablas/listas */
    .citas,.familiares,.recordatorios,.records,.lista-citas,
    .medications,.medicamentos{
        width:100%;
        overflow-x:auto;
    }

    .encabezado h1,.page-header h1{font-size:24px !important;}

    /* Formularios */
    .login,.principal,.contenedor{
        width:min(100%, 520px) !important;
        margin-left:auto !important;
        margin-right:auto !important;
    }

    input,select,textarea{max-width:100%;}
}

@media (max-width: 480px){
    .header-buttons{
        justify-content:center;
        flex-wrap:wrap;
    }

    .header-buttons a{
        flex:1 1 120px;
        text-align:center;
    }

    .menu a span{display:none;}
    .menu a{
        min-width:42px;
        justify-content:center;
    }

    .content,.contenido{padding:18px 12px !important;}

    .card,.quick-card,.tarjeta,.seccion,.cita,.familia,.record,
    .history-box,.medicine-card,.medication-card,.registro,.perfil{
        border-radius:12px !important;
    }

    .btn-agregar,.btn-nueva,.btn-comenzar,.btn-ingresar{
        width:100%;
    }
}
</style>

</head>

<body>

    <aside class="lado">

        <div class="logo">
            <img src="assets/logo.png" alt="MediControl">
        </div>

        <nav class="menu">

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Inicio
            </a>

            <a href="login.html">
                <i class="fa-solid fa-right-to-bracket"></i>
                Iniciar sesión
            </a>

            <a href="registro.html">
                <i class="fa-solid fa-user-plus"></i>
                Registrarse
            </a>

        </nav>

    </aside>


    <main class="principal">

        <section class="login">

            <div class="logo-login">
                <img src="assets/logo.png" alt="MediControl">
            </div>

            <h1>Iniciar sesión</h1>
            <p class="subtitulo">Ingresa a tu cuenta para continuar</p>


            <form onsubmit="iniciarSesion(event)">

                <label for="usuario">Nombre o apellido</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingresa tu nombre o apellido"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu DNI"
                    required
                >

                <div class="opciones">

                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#" onclick="alert('Función disponible próximamente.')">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button type="submit" class="btn-ingresar">
                    Iniciar sesión
                </button>

            </form>


            <div class="separador">
                o
            </div>


            <div class="tipos">

                <!-- AHORA SÍ LLEVA AL PACIENTE -->
                <button class="tipo" onclick="location.href='paciente.html'">
                    <i class="fa-solid fa-user"></i>
                    <br>
                    Ingresar como Paciente
                </button>

                <!-- AHORA SÍ LLEVA AL APODERADO -->
                <button class="tipo" onclick="location.href='apoderado.html'">
                    <i class="fa-solid fa-users"></i>
                    <br>
                    Ingresar como Apoderado
                </button>

            </div>


            <p class="registro">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>

        </section>

    </main>


    <script>
        function iniciarSesion(event) {
            event.preventDefault();

            // Para el prototipo básico:
            // el usuario puede elegir directamente el tipo de ingreso.
            alert("Selecciona 'Ingresar como Paciente' o 'Ingresar como Apoderado'.");
        }
    </script>

</body>
</html>
