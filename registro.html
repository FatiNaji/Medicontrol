<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MediControl</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#eef8ff;
            color:#17243b;
            min-height:100vh;
        }
        a{text-decoration:none}
        .topbar{
            height:70px;background:#fff;border-bottom:1px solid #e4edf5;
            display:flex;align-items:center;justify-content:space-between;padding:0 55px;
        }
        .logo img{width:145px;height:50px;object-fit:contain}
        .back{
            color:#0878d1;font-size:13px;font-weight:bold;
            display:inline-flex;align-items:center;gap:7px;
            transition:.2s;
        }
        .back:hover{transform:translateX(-3px)}
        .wrap{
            width:min(960px,calc(100% - 32px));
            margin:35px auto 50px;
        }
        .intro{text-align:center;margin-bottom:25px}
        .intro h1{font-size:31px;margin-bottom:8px}
        .intro p{font-size:13px;color:#718096}
        .register-card{
            background:#fff;border:1px solid #e2edf5;border-radius:16px;
            padding:28px;box-shadow:0 10px 30px rgba(25,65,100,.08);
        }
        .roles{
            display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:24px;
        }
        .role{
            border:1px solid #dce8f2;border-radius:12px;padding:18px;
            cursor:pointer;background:#fff;transition:.22s;
            display:flex;align-items:center;gap:14px;
        }
        .role:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(25,65,100,.10)}
        .role.active{border-color:#0878d1;background:#f3faff;box-shadow:0 0 0 3px rgba(8,120,209,.10)}
        .role-icon{
            width:48px;height:48px;border-radius:50%;background:#e2f3ff;color:#0878d1;
            display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
        }
        .role h3{font-size:15px;margin-bottom:4px}
        .role p{font-size:11px;color:#718096;line-height:1.4}
        form{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
        .field{display:flex;flex-direction:column;gap:7px}
        .field.full{grid-column:1/-1}
        label{font-size:12px;font-weight:bold;color:#40516a}
        input{
            width:100%;padding:12px 13px;border:1px solid #d7e3ec;border-radius:8px;
            font-size:13px;color:#17243b;transition:.2s;
        }
        input:focus{outline:none;border-color:#0878d1;box-shadow:0 0 0 3px rgba(8,120,209,.12)}
        .actions{grid-column:1/-1;display:flex;justify-content:center;margin-top:8px}
        .submit{
            border:0;background:#0878d1;color:#fff;padding:13px 30px;border-radius:8px;
            font-size:13px;font-weight:bold;cursor:pointer;transition:.22s;
            display:inline-flex;align-items:center;gap:8px;
            box-shadow:0 6px 18px rgba(8,120,209,.18);
        }
        .submit:hover{background:#0667b4;transform:translateY(-2px);box-shadow:0 10px 22px rgba(8,120,209,.22)}
        .note{text-align:center;margin-top:17px;font-size:11px;color:#718096}
        .note a{color:#0878d1;font-weight:bold}
        @media(max-width:650px){
            .topbar{padding:0 18px}
            .logo img{width:120px}
            .roles,form{grid-template-columns:1fr}
            .field.full{grid-column:auto}
            .register-card{padding:20px}
            .intro h1{font-size:26px}
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="index.html"><img src="assets/logo.png" alt="MediControl"></a>
        <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
    </header>

    <main class="wrap">
        <div class="intro">
            <h1>Crear tu cuenta</h1>
            <p>Selecciona cómo utilizarás MediControl y completa tus datos.</p>
        </div>

        <section class="register-card">
            <div class="roles">
                <div class="role active" data-role="paciente">
                    <div class="role-icon"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <h3>Paciente</h3>
                        <p>Gestiona tus medicamentos, citas y recordatorios.</p>
                    </div>
                </div>

                <div class="role" data-role="apoderado">
                    <div class="role-icon"><i class="fa-solid fa-user-shield"></i></div>
                    <div>
                        <h3>Apoderado</h3>
                        <p>Realiza seguimiento de la persona a tu cargo.</p>
                    </div>
                </div>
            </div>

            <form id="registroForm">
                <input type="hidden" id="rol" value="paciente">

                <div class="field">
                    <label for="nombre">Nombres</label>
                    <input id="nombre" required placeholder="Ingresa tus nombres">
                </div>

                <div class="field">
                    <label for="apellido">Apellidos</label>
                    <input id="apellido" required placeholder="Ingresa tus apellidos">
                </div>

                <div class="field">
                    <label for="dni">DNI</label>
                    <input id="dni" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required placeholder="8 dígitos">
                </div>

                <div class="field">
                    <label for="confirmar">Confirmar DNI</label>
                    <input id="confirmar" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required placeholder="Repite tu DNI">
                </div>

                <div class="actions">
                    <button class="submit" type="submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Crear cuenta
                    </button>
                </div>
            </form>

            <p class="note">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </section>
    </main>

    <script>
        const roles=document.querySelectorAll('.role');
        const rol=document.getElementById('rol');
        roles.forEach(card=>{
            card.addEventListener('click',()=>{
                roles.forEach(r=>r.classList.remove('active'));
                card.classList.add('active');
                rol.value=card.dataset.role;
            });
        });

        document.getElementById('registroForm').addEventListener('submit',e=>{
            e.preventDefault();
            const dni=document.getElementById('dni').value.trim();
            const confirmar=document.getElementById('confirmar').value.trim();

            if(!/^\d{8}$/.test(dni)){
                alert('Ingresa un DNI válido de 8 dígitos.');
                return;
            }
            if(dni!==confirmar){
                alert('Los DNI no coinciden.');
                return;
            }

            if(rol.value==='apoderado'){
                window.location.href='apoderado.html';
            }else{
                window.location.href='paciente.html';
            }
        });
    </script>
</body>
</html>
